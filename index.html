<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe Game</title>
</head>
<body>
    <header>
        <h1>Tic Tac Toe Game</h1>
    </header>
    <main>
        <button class="new-game">New game</button>
        <div class="game-board">
            <div class="spot 0"><p>*</p></div>
            <div class="spot 1"><p>*</p></div>
            <div class="spot 2"><p>*</p></div>
            <div class="spot 3"><p>*</p></div>
            <div class="spot 4"><p>*</p></div>
            <div class="spot 5"><p>*</p></div>
            <div class="spot 6"><p>*</p></div>
            <div class="spot 7"><p>*</p></div>
            <div class="spot 8"><p>*</p></div>
        </div>
    </main>
    <div class="sign">
        <h3>Choose your sign</h3>
        <button class="signBtn" value="X">X</button>
        <button class="signBtn" value="O">O</button>
    </div>
    <script src="script2.js"></script>
</body>
</html>
